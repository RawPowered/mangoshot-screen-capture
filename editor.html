<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangoShot Editor</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">🥭 MangoShot <span class="muted">/ Image editor</span></div><small>LOCAL FIRST · NO UPLOAD</small></header><div class="toolbar"><label>Tool <select id="tool"><option value="pen">Pen</option><option value="highlighter">Highlighter</option><option value="eraser">Eraser</option></select></label><label>Color <input id="color" type="color" value="#ffba08"></label><label>Size <input id="size" type="range" min="1" max="30" value="4"></label><button id="undo">Undo</button><button id="clear">Clear ink</button><button id="png" class="primary" disabled>Export PNG</button><button id="pdf" disabled>Print / Save PDF</button><span class="status" id="status" role="status">Initializing…</span></div><main class="workspace"><div class="canvas-wrap"><canvas id="base"></canvas><canvas class="overlay" id="ink"></canvas></div></main><script src="editor.js"></script></body></html>
