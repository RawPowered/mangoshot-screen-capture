<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangoShot · Image editor</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><span aria-hidden="true">🥭</span> MangoShot <span class="muted">/ Image studio</span></div><small>PRIVATE · ON DEVICE</small></header><div class="toolbar"><label>Tool <select id="tool"><option value="pen">Pen</option><option value="highlighter">Highlighter</option><option value="eraser">Eraser</option><option value="arrow">Arrow</option><option value="rectangle">Rectangle</option><option value="redact">Redact</option><option value="text">Text</option></select></label><label>Color <input id="color" type="color" value="#ffb100"></label><label>Size <input id="size" type="range" min="1" max="24" value="4"></label><label>Text <input id="text-value" maxlength="120" value="Note" aria-label="Text annotation"></label><label>Zoom <select id="zoom"><option value="fit">Fit</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="1.5">150%</option></select></label><button id="undo" disabled>Undo</button><button id="clear" disabled>Clear ink</button><button id="png" class="primary" disabled>Save PNG</button><button id="pdf" disabled>Save PDF</button><span id="status" class="status" role="status" aria-live="polite">Preparing capture…</span></div><main id="workspace" class="workspace"><div class="canvas-wrap" id="canvas-wrap"><canvas id="base" aria-label="Captured webpage"></canvas><canvas id="ink" class="overlay" aria-label="Screenshot annotation surface"></canvas></div></main><script src="pdf-export.js"></script><script src="editor.js"></script></body></html>
