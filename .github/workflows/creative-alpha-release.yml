name: MangoShot v0.6.1 Creative Alpha Release
on:
  push:
    branches:
      - feat/mangoshot-v0.6.1-creative-tools
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-release:
    if: github.repository == 'RawPowered/mangoshot-screen-capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression suite and creative tools tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for source in clip-studio.js clip-graphics.js clip-graphics-ui.js creative-zoom.js voiceover.js creative-studio-ui.js; do node --check "$source"; done
      - name: Build complete extension and overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package-extension.py --out dist --version v0.6.1-creative-alpha.1
          python3 tools/build-creative-overlay.py --out dist
          unzip -t dist/MangoShot-v0.6.1-creative-alpha.1-Extension.zip
          unzip -t dist/MangoShot-v0.6.1-creative-overlay-from-v0.6.0.zip
          (cd dist && sha256sum MangoShot-*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.6.1-creative-tools
          path: |
            dist/MangoShot-v0.6.1-creative-alpha.1-Extension.zip
            dist/MangoShot-v0.6.1-creative-overlay-from-v0.6.0.zip
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish immutable development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v0.6.1-creative-alpha.1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Tagged release already published: refusing to overwrite."
            exit 0
          fi
          gh release create "$tag" \
            dist/MangoShot-v0.6.1-creative-alpha.1-Extension.zip \
            dist/MangoShot-v0.6.1-creative-overlay-from-v0.6.0.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'MangoShot v0.6.1 — Creative Tools Alpha 2' \
            --notes-file docs/V0.6.1-CREATIVE-TOOLS.md \
            --prerelease --latest=false
