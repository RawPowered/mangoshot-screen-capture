name: Professional workspace qualification
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.7.59-professional-workspace
jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/professional-workspace-v0759.cjs
      - run: node tests/studio-workspaces.cjs
      - run: node tests/recording-lifecycle-v0757.cjs
      - run: node tests/unified-motion-v0758.cjs
