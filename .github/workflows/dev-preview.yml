name: MangoShot v0.6 Development Build
on:
  push:
    branches:
      - feat/mangoshot-v0.6-media-workspace
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
      - name: Package unpacked development extension
        run: python3 tools/package-extension.py --out dist --version v0.6.0-preview.1
      - name: Upload installable development build
        uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.6.0-workspace-dev
          path: dist/MangoShot-v0.6.0-preview.1-Extension.zip
          retention-days: 14
