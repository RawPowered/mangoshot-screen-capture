name: MangoShot v0.6.2 UX Alpha 3
on:
  push:
    branches:
      - feat/mangoshot-v0.6.2-workspace-ux
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build-publish:
    if: github.repository == 'RawPowered/mangoshot-screen-capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression suite, including UIX gates
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for source in clip-studio.js clip-timeline-ui.js clip-workspace-v062.js; do node --check "$source"; done
      - name: Build versioned full extension and v0.6.1 overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package-extension.py --out dist --version v0.6.2-ux-alpha.1
          python3 tools/build-v062-overlay.py --out dist
          unzip -t dist/MangoShot-v0.6.2-ux-alpha.1-Extension.zip
          unzip -t dist/MangoShot-v0.6.2-ux-overlay-from-v0.6.1.zip
          (cd dist && sha256sum MangoShot-*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.6.2-ux-alpha.1-builds
          path: |
            dist/MangoShot-v0.6.2-ux-alpha.1-Extension.zip
            dist/MangoShot-v0.6.2-ux-overlay-from-v0.6.1.zip
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish immutable GitHub development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v0.6.2-ux-alpha.1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: will not overwrite versioned assets."
            exit 0
          fi
          gh release create "$tag" \
            dist/MangoShot-v0.6.2-ux-alpha.1-Extension.zip \
            dist/MangoShot-v0.6.2-ux-overlay-from-v0.6.1.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'MangoShot v0.6.2 — Focused Clip Studio UX Alpha 3' \
            --notes-file docs/V0.6.2-WORKSPACE-UX.md \
            --prerelease --latest=false
