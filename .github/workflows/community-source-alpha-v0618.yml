name: MangoShot v0.6.18 Community Source Alpha 2

on:
  push:
    branches:
      - docs/mangoshot-v0.6.18-community-license-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.repository == 'RawPowered/mangoshot-screen-capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime regressions and community-license documentation
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for src in ./*.js; do node --check "$src"; done
          python3 -m py_compile tools/package-extension.py
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          grep -q 'NO RESALE OR PAID SOFTWARE DISTRIBUTION' LICENSE
          grep -q 'v0.6.18-layers-alpha.2' README.md
      - name: Package licensed extension and exact-source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/package-extension.py --out dist --version v0.6.18-layers-alpha.2
          git archive --format=zip --output=dist/MangoShot-v0.6.18-layers-alpha.2-Source.zip HEAD
          unzip -t dist/MangoShot-v0.6.18-layers-alpha.2-Extension.zip
          unzip -t dist/MangoShot-v0.6.18-layers-alpha.2-Source.zip
          unzip -p dist/MangoShot-v0.6.18-layers-alpha.2-Extension.zip LICENSE | grep -q 'MANGOSHOT COMMUNITY SOURCE-AVAILABLE LICENSE 1.0'
          unzip -p dist/MangoShot-v0.6.18-layers-alpha.2-Extension.zip README.md | grep -q 'Alt + drag'
          unzip -p dist/MangoShot-v0.6.18-layers-alpha.2-Source.zip LICENSE | grep -q 'NO RESALE OR PAID SOFTWARE DISTRIBUTION'
          (cd dist && sha256sum MangoShot-*.zip > SHA256SUMS.txt)
      - name: Preserve release artifacts in CI
        uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.6.18-community-source-alpha.2
          path: |
            dist/MangoShot-v0.6.18-layers-alpha.2-Extension.zip
            dist/MangoShot-v0.6.18-layers-alpha.2-Source.zip
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish immutable public development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v0.6.18-layers-alpha.2'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag already exists. Immutable release will not be overwritten."
            exit 0
          fi
          gh release create "$tag" \
            dist/MangoShot-v0.6.18-layers-alpha.2-Extension.zip \
            dist/MangoShot-v0.6.18-layers-alpha.2-Source.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'MangoShot v0.6.18 — Community Source & Full Features Alpha 2' \
            --notes-file docs/V0.6.18-COMMUNITY-SOURCE-ALPHA2.md \
            --prerelease --latest=false
