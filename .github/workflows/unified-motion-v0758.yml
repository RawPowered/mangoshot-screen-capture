name: Unified motion timeline v0.7.58
on:
  push:
    branches: [feature/v0.7.58-unified-motion-timeline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and focused motion gates
        run: |
          set -euo pipefail
          for f in auto-cut.js clip-graphics-ui.js clip-graphics.js clip-studio.js compositor-core-v0714.js compositor-ui-v0714.js creative-studio-ui.js creative-zoom.js cursor-director-ui-v074.js motion-core-v0750.js motion-studio-v0750.js sequence-engine-v076.js timeline-motion-gesture-v0758.js zoom-hud-v063.js zoom-studio-v0738.js; do node --check "$f"; done
          for t in unified-motion-v0758 motion-studio-v0750 compositor-v0714 sequence-operations sequence-engine-v076 professional-timeline-v0717 graphic-layer-gestures zoom-studio-v0738 clean-master-v0752 core-integrity-v0756 render-integrity-v0755 recording-lifecycle-v0757; do node "tests/$t.cjs"; done
