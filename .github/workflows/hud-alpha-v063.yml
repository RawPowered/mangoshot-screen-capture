name: MangoShot v0.6.3 Camera Typography Alpha 4
on:
  push:
    branches:
      - feat/mangoshot-v0.6.3-zoom-hud-type-ui
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-publish:
    if: github.repository == 'RawPowered/mangoshot-screen-capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all Clip Studio and capture regression suites
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for source in clip-studio.js clip-graphics.js clip-graphics-ui.js creative-studio-ui.js clip-project.js zoom-hud-v063.js type-hud-v063.js; do node --check "$source"; done
      - name: Package extension and versioned overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package-extension.py --out dist --version v0.6.3-hud-alpha.1
          python3 tools/build-v063-overlay.py --out dist
          unzip -t dist/MangoShot-v0.6.3-hud-alpha.1-Extension.zip
          unzip -t dist/MangoShot-v0.6.3-hud-overlay-from-v0.6.2.zip
          (cd dist && sha256sum MangoShot-*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.6.3-interactive-zoom-and-style-galleries
          path: |
            dist/MangoShot-v0.6.3-hud-alpha.1-Extension.zip
            dist/MangoShot-v0.6.3-hud-overlay-from-v0.6.2.zip
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish immutable versioned development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v0.6.3-hud-alpha.1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 0
          fi
          gh release create "$tag" \
            dist/MangoShot-v0.6.3-hud-alpha.1-Extension.zip \
            dist/MangoShot-v0.6.3-hud-overlay-from-v0.6.2.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'MangoShot v0.6.3 — Interactive Zoom HUD & Typography Alpha 4' \
            --notes-file docs/V0.6.3-HUD-PRESETS.md \
            --prerelease --latest=false
