name: MangoShot regression gates
on:
  push:
  pull_request:
jobs:
  browser-extension-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manifest, editor, recorder and export regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in auto-cut auto-cut-ui sequence-media sequence-preview timeline-media-ui native-fast-render sequence-operations static routing editor-protocol timeline-camera sequence-operations recorder-controls stop-safety clip-studio-mock clip-timeline-ui clip-store-handoff repeat-recording ui-structure media-format layered-editing graphic-layer-gestures project-format studio-workspaces pdf; do
            node "tests/${test}.cjs"
          done
          node tests/motion-v067.cjs
          node tests/visual-inspector-v068.cjs
          node tests/premium-v069.cjs
          node tests/full-capture-v0610.cjs
          node tests/popup-full-v0610.cjs
          node tests/ux-v0610.cjs
          node tests/image-editor-v0611.cjs
          node tests/image-layers-v0612.cjs
          node tests/image-typefx-v0613.cjs
          node tests/capture-output-v0614.cjs
          node tests/area-capture-v0614.cjs
          node tests/image-vector-v0615.cjs
          node tests/clip-tools-v0615.cjs
          node tests/pen-wacom-v0616.cjs
          node tests/shortcuts-v0617.cjs
          node tests/menus-v0617.cjs
          node tests/layers-v0618.cjs
          node tests/editor-core-v070.cjs
          node tests/professional-uix-v070.cjs
          node tests/viewport-cursors-v071.cjs
          node tests/studio-layout-v072.cjs
          node tests/cursor-effects-v073.cjs
          node tests/cursor-director-v074.cjs
          node tests/automation-v075.cjs
          node tests/sequence-engine-v076.cjs
          node tests/bridge-core-v077.cjs
          node tests/carbon-theme-v078.cjs
          node tests/creative-foundation-v079.cjs
          node tests/recorder-control-v0710.cjs
          node tests/tool-studio-v0711.cjs
          node tests/layer-studio-v0712.cjs
          node tests/cinematic-v0713.cjs
          node tests/compositor-v0714.cjs
          node tests/transform-material-v0715.cjs
          node tests/multitrack-v0716.cjs
          node tests/professional-timeline-v0717.cjs
          node tests/streaming-media-v0718.cjs
          node tests/independent-sequence-v0719.cjs
          node tests/carbon-image-v0720.cjs
          node tests/precision-visual-v0721.cjs
          node --check precision-visual-v0721.js
          node tests/mango-raster-v0722.cjs
          node tests/image-document-v0723.cjs
          node tests/advanced-compositor-v0724.cjs
          node tests/brush-v0725.cjs
          node tests/creative-effects-v0726.cjs
          node tests/raster-layer-v0727.cjs
          node --check raster-layer-core-v0727.js
          node --check raster-layer-ui-v0727.js
          node --check creative-effects-core-v0726.js
          node --check creative-effects-ui-v0726.js
          node --check brush-core-v0725.js
          node --check brush-studio-v0725.js
          node --check advanced-compositor-core-v0724.js
          node --check advanced-compositor-ui-v0724.js
          node --check image-document-core-v0723.js
          node --check image-document-ui-v0723.js
          node --check mango-raster-core-v0722.js
          node --check mango-raster-worker-v0722.js
          node --check mango-raster-ui-v0722.js
          node --check carbon-image-v0720.js
          node --check independent-sequence-core-v0719.js
          node --check independent-sequence-runtime-v0719.js
          node --check professional-sequence-ui-v0719.js
          node --check streaming-media-v0718.js
          node --check professional-timeline-core-v0717.js
          node --check professional-timeline-ui-v0717.js
          node --check multitrack-core-v0716.js
          node --check multitrack-ui-v0716.js
          node --check transform-material-core-v0715.js
          node --check compositor-core-v0714.js
          node --check compositor-ui-v0714.js
          node --check cinematic-core-v0713.js
          node --check cinematic-ui-v0713.js
          node --check layer-studio-core-v0712.js
          node --check layer-studio-ui-v0712.js
          node --check tool-studio-ui-v0711.js
          node --check recorder-control-v0710.js
          node --check creative-library-v079.js
          node --check studio-icons-v079.js
          node --check bridge-core-v077.js
          node --check bridge-ui-v077.js
          python3 tests/tunnel-wizard-v0772.py
          python3 -m py_compile companion/tunnel_wizard.py companion/mangoshot_bridge.py
          timeout 90s python3 tests/bridge-native-v077.py
          for src in sequence-engine-v076.js sequence-studio-v076.js; do node --check "$src"; done
          for src in automation-core-v075.js automation-adapters-v075.js automation-ui-v075.js; do node --check "$src"; done
          for src in cursor-director-core-v074.js cursor-director-ui-v074.js; do node --check "$src"; done
          for src in cursor-effects-v073.js cursor-recorder-v073.js cursor-clip-v073.js linked-tab.js; do node --check "$src"; done
          node --check studio-layout-core-v072.js
          node --check studio-overlays-v072.js
          for src in studio-control-core-v070.js studio-professional-v070.js precision-cursors-v071.js image-tool-groups-v071.js image-canvas-viewport-v071.js; do node --check "$src"; done
      - name: Package MangoShot v0.7.1 precision tools development preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.7.1-viewport-precision-tools'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package-extension.py --out dist --version v0.6.18-uix-b1-preview
          unzip -t dist/MangoShot-v0.6.18-uix-b1-preview-Extension.zip
          unzip -l dist/MangoShot-v0.6.18-uix-b1-preview-Extension.zip | grep studio-professional-v070.js
          unzip -l dist/MangoShot-v0.6.18-uix-b1-preview-Extension.zip | grep studio-professional-v070.css
          unzip -l dist/MangoShot-v0.6.18-uix-b1-preview-Extension.zip | grep studio-control-core-v070.js
          unzip -l dist/MangoShot-v0.6.18-uix-b1-preview-Extension.zip | grep studio-viewport-v071.css
          unzip -l dist/MangoShot-v0.6.18-uix-b1-preview-Extension.zip | grep precision-cursors-v071.js
      - name: Upload development preview ZIP (not a release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.7.1-viewport-precision-tools'
        uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.7.1-Precision-Tools-Preview
          path: dist/MangoShot-v0.6.18-uix-b1-preview-Extension.zip
          retention-days: 14

  studio-precision-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.7.27-mangoengine-integration'
    runs-on: ubuntu-latest
    needs: browser-extension-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke test tooling
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Compile production-facing raster module and validate byte parity
        run: |
          rustup target add wasm32-unknown-unknown
          rustc --edition=2021 --test engine/mango-raster-v0722.rs -o /tmp/mango-raster-native-tests
          /tmp/mango-raster-native-tests
          rustc --edition=2021 --target wasm32-unknown-unknown --crate-type=cdylib -C opt-level=3 -C panic=abort engine/mango-raster-v0722.rs -o mango-engine-v0722.wasm
          node tests/mango-raster-wasm-v0722.cjs mango-engine-v0722.wasm
      - name: Test both actual editor surfaces
        run: |
          node tests/studio-overlays-v072.browser.cjs
          node tests/cursor-studio-v073.browser.cjs
          node tests/cursor-director-v074.browser.cjs
          node tests/automation-v075.browser.cjs
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -loglevel error -f lavfi -i color=c=blue:s=320x180:r=15:d=6 -c:v libvpx-vp9 -pix_fmt yuv420p -an -y /tmp/mangoshot-sequence-test.webm
          node tests/sequence-studio-v076.browser.cjs /tmp/mangoshot-sequence-test.webm
          timeout 120s node tests/bridge-v077.browser.cjs /tmp/mangoshot-sequence-test.webm
          timeout 120s node tests/carbon-theme-v078.browser.cjs /tmp/mangoshot-sequence-test.webm
          timeout 120s node tests/creative-foundation-v079.browser.cjs /tmp/mangoshot-sequence-test.webm
          timeout 120s node tests/recorder-precision-v0710.browser.cjs
          timeout 120s node tests/tool-studio-v0711.browser.cjs /tmp/mangoshot-sequence-test.webm
          timeout 120s node tests/layer-studio-v0712.browser.cjs /tmp/mangoshot-sequence-test.webm
          ffmpeg -loglevel error -f lavfi -i color=c=red:s=320x180:r=24:d=3 -f lavfi -i color=c=blue:s=320x180:r=24:d=3 -filter_complex '[0:v][1:v]concat=n=2:v=1:a=0' -c:v libvpx-vp9 -pix_fmt yuv420p -an -y /tmp/mangoshot-cinematic-test.webm
          timeout 180s node tests/cinematic-v0713.browser.cjs /tmp/mangoshot-cinematic-test.webm
          timeout 180s node tests/compositor-v0714.browser.cjs /tmp/mangoshot-cinematic-test.webm
      - name: Prepare independent transform and multitrack fixtures
        if: ${{ !cancelled() }}
        run: |
          ffmpeg -loglevel error -f lavfi -i color=c=red:s=320x180:r=24:d=3 -f lavfi -i color=c=blue:s=320x180:r=24:d=3 -filter_complex '[0:v][1:v]concat=n=2:v=1:a=0' -c:v libvpx-vp9 -pix_fmt yuv420p -an -y /tmp/mangoshot-cinematic-test.webm
          ffmpeg -loglevel error -f lavfi -i color=c=lime:s=320x180:r=15:d=3 -c:v libvpx-vp9 -pix_fmt yuv420p -an -y /tmp/mangoshot-secondary-test.webm
          ffmpeg -loglevel error -f lavfi -i sine=frequency=880:sample_rate=48000:duration=2 -c:a pcm_s16le -y /tmp/mangoshot-secondary-test.wav
      - name: Qualify transform, material and rotated-mask PNG
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/transform-material-v0715.browser.cjs /tmp/mangoshot-cinematic-test.webm
      - name: Qualify real multitrack WebM and mixed audio
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/multitrack-v0716.browser.cjs /tmp/mangoshot-cinematic-test.webm /tmp/mangoshot-secondary-test.webm /tmp/mangoshot-secondary-test.wav
      - name: Qualify professional timeline gestures
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/professional-timeline-v0717.browser.cjs /tmp/mangoshot-cinematic-test.webm /tmp/mangoshot-secondary-test.webm
      - name: Qualify long native streaming and encoded timeline colors
        if: ${{ !cancelled() }}
        run: |
          ffmpeg -loglevel error -f lavfi -i color=c=red:s=320x180:r=24:d=9 -f lavfi -i color=c=blue:s=320x180:r=24:d=9 -filter_complex '[0:v][1:v]concat=n=2:v=1:a=0' -c:v libvpx-vp9 -pix_fmt yuv420p -an -y /tmp/mangoshot-stream-primary.webm
          ffmpeg -loglevel error -f lavfi -i color=c=lime:s=1280x720:r=24:d=4 -f lavfi -i color=c=yellow:s=1280x720:r=24:d=5 -f lavfi -i color=c=cyan:s=1280x720:r=24:d=5 -filter_complex '[0:v][1:v][2:v]concat=n=3:v=1:a=0' -c:v libvpx-vp9 -deadline realtime -cpu-used 5 -pix_fmt yuv420p -an -y /tmp/mangoshot-stream-secondary.webm
          timeout 200s node tests/streaming-media-v0718.browser.cjs /tmp/mangoshot-stream-primary.webm /tmp/mangoshot-stream-secondary.webm
      - name: Qualify independent sequence with actual source video and audio
        if: ${{ !cancelled() }}
        run: |
          ffmpeg -loglevel error -f lavfi -i color=c=red:s=320x180:r=24:d=3 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=3 -c:v libvpx-vp9 -pix_fmt yuv420p -c:a libopus -shortest -y /tmp/mangoshot-seq-red.webm
          ffmpeg -loglevel error -f lavfi -i color=c=blue:s=320x180:r=24:d=3 -f lavfi -i sine=frequency=880:sample_rate=48000:duration=3 -c:v libvpx-vp9 -pix_fmt yuv420p -c:a libopus -shortest -y /tmp/mangoshot-seq-blue.webm
          timeout 180s node tests/independent-sequence-v0719.browser.cjs /tmp/mangoshot-seq-red.webm /tmp/mangoshot-seq-blue.webm /tmp/mangoshot-secondary-test.wav
      - name: Qualify Carbon Image Studio and draft isolation
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/carbon-image-v0720.browser.cjs
      - name: Qualify precision visual controls, material and dock
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/precision-visual-v0721.browser.cjs
      - name: Qualify actual MangoEngine image studio and PNG export
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/mango-raster-v0722.browser.cjs
      - name: Qualify native editable image documents and layer previews
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/image-document-v0723.browser.cjs
      - name: Qualify isolated render groups and source adjustments
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/advanced-compositor-v0724.browser.cjs
      - name: Qualify precision brush pressure, presets and native document roundtrip
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/brush-v0725.browser.cjs
      - name: Qualify creative gradients, shadow stack, mask and native document v4
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/creative-effects-v0726.browser.cjs
      - name: Qualify editable MangoEngine raster layers and native document v5
        if: ${{ !cancelled() }}
        run: timeout 180s node tests/raster-layer-v0727.browser.cjs
      - name: Package development preview (not a release)
        run: |
          python3 tools/package-extension.py --out dist --version v0.6.18-mango-engine-raster-preview
          unzip -t dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep mango-engine-v0722.wasm
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep image-document-core-v0723.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep image-document-ui-v0723.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep advanced-compositor-core-v0724.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep advanced-compositor-ui-v0724.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep advanced-compositor-v0724.css
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep brush-core-v0725.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep brush-studio-v0725.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep brush-studio-v0725.css
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep creative-effects-core-v0726.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep creative-effects-ui-v0726.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep creative-effects-v0726.css
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep raster-layer-core-v0727.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep raster-layer-ui-v0727.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep raster-layer-v0727.css
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep carbon-image-v0720.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep carbon-image-v0720.css
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep precision-visual-v0721.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep precision-visual-v0721.css
          python3 -c "import json,zipfile; z=zipfile.ZipFile('dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip'); assert z.read('manifest.json')==open('manifest.json','rb').read(); assert 'nativeMessaging' in json.loads(z.read('manifest.json'))['permissions']"
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep studio-precision-v072.css
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep studio-layout-core-v072.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep studio-overlays-v072.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep cursor-effects-v073.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep cursor-recorder-v073.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep cursor-clip-v073.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep cursor-director-core-v074.js
          unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep cursor-director-ui-v074.js
          for src in professional-sequence.html professional-sequence-v0719.css professional-sequence-ui-v0719.js independent-sequence-core-v0719.js independent-sequence-runtime-v0719.js streaming-media-v0718.js professional-timeline-core-v0717.js professional-timeline-ui-v0717.js professional-timeline-v0717.css multitrack-core-v0716.js multitrack-ui-v0716.js multitrack-v0716.css transform-material-core-v0715.js transform-material-v0715.css compositor-core-v0714.js compositor-ui-v0714.js compositor-v0714.css cinematic-core-v0713.js cinematic-ui-v0713.js cinematic-v0713.css layer-studio-core-v0712.js layer-studio-ui-v0712.js layer-studio-v0712.css tool-studio-core-v0711.js tool-studio-ui-v0711.js tool-studio-v0711.css recorder-control-v0710.js recorder-controls-v0710.css theme-carbon-v078.css bridge-core-v077.js bridge-ui-v077.js bridge-v077.css sequence-engine-v076.js sequence-studio-v076.js sequence-studio-v076.css automation-core-v075.js automation-adapters-v075.js automation-ui-v075.js automation-v075.css; do unzip -l dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip | grep "$src"; done
      - uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.7.27-MangoEngine-Integration-Extension
          path: dist/MangoShot-v0.6.18-mango-engine-raster-preview-Extension.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MangoShot-v0.7.27-MangoEngine-Integration-Screenshots
          path: |
            carbon-screenshots/
            creative-screenshots/
            recorder-screenshots/
            tool-studio-screenshots/
            layer-studio-screenshots/
            cinematic-screenshots/
            compositor-screenshots/
            transform-material-screenshots/
            multitrack-screenshots/
            professional-timeline-screenshots/
            streaming-screenshots/
            independent-sequence-screenshots/
            carbon-image-screenshots/
            precision-visual-screenshots/
            mango-raster-screenshots/
            image-document-screenshots/
            advanced-compositor-screenshots/
            brush-studio-screenshots/
            creative-effects-screenshots/
            raster-layer-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  companion-windows-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.7.7.2-chatgpt-tunnel'
    runs-on: windows-latest
    timeout-minutes: 12
    needs: browser-extension-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unsigned Windows companion preview
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name MangoShotBridge --distpath companion-dist companion/mangoshot_bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify launcher, native host and MCP stdio executable
        shell: pwsh
        run: |
          python tests/tunnel-wizard-v0772.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = & companion-dist/MangoShotBridge.exe --version
          if ($LASTEXITCODE -ne 0 -or $v -ne 'MangoShotBridge 0.7.7.2') { throw 'Wrong companion version' }
          python tests/bridge-native-v077.py companion-dist/MangoShotBridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'companion/install-windows.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'Invalid PowerShell installer syntax' }
      - name: Package companion with source and license
        shell: pwsh
        run: |
          Copy-Item companion/install-windows.ps1 companion-dist/
          Copy-Item companion/mangoshot_bridge.py companion-dist/
          Copy-Item companion/tunnel_wizard.py companion-dist/
          Copy-Item docs/V0.7.7.2-CHATGPT-TUNNEL.md companion-dist/README.md
          Copy-Item LICENSE companion-dist/LICENSE
          Compress-Archive -Path companion-dist/* -DestinationPath MangoShot-v0.7.7.2-Windows-Companion-Preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.7.7.2-Windows-Companion
          path: MangoShot-v0.7.7.2-Windows-Companion-Preview.zip
          retention-days: 14

  mango-engine-experiment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.7.27-mangoengine-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test isolated Rust kernel
        run: |
          rustc --version
          rustup target add wasm32-unknown-unknown
          mkdir -p engine-experiment
          rustc --edition=2021 --test experiments/mango-engine/lib.rs -o engine-experiment/native-tests
          engine-experiment/native-tests
          rustc --edition=2021 --target wasm32-unknown-unknown --crate-type=cdylib -C opt-level=3 -C panic=abort experiments/mango-engine/lib.rs -o engine-experiment/mango-engine.wasm
          node experiments/mango-engine/benchmark.cjs engine-experiment/mango-engine.wasm | tee engine-experiment/benchmark.jsonl
