name: MangoShot regression gates
on:
  push:
  pull_request:
jobs:
  browser-extension-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manifest, editor, recorder and export regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in sequence-operations static routing editor-protocol timeline-camera sequence-operations recorder-controls stop-safety clip-studio-mock clip-timeline-ui clip-store-handoff repeat-recording ui-structure media-format layered-editing graphic-layer-gestures project-format studio-workspaces pdf; do
            node "tests/${test}.cjs"
          done
