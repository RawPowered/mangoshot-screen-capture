name: MangoShot v0.6.17 Keyboard Shortcuts & Menus Alpha 1
on:
  push:
    branches:
      - feat/mangoshot-v0.6.17-shortcuts-command-menus
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build-publish:
    if: github.repository == 'RawPowered/mangoshot-screen-capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full tests, shared shortcut bindings, menu keyboard focus, palette and editor command compatibility
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do node "$test"; done
          for src in clip-studio.js clip-graphics.js type-hud-v063.js \
            clip-media-bin.js workspace-resize-v066.js preset-pack-v066.js polish-icons-v066.js motion-core-v067.js motion-ui-v067.js visual-inspector-v068.js premium-core-v069.js premium-ui-v069.js resources-v069.js popup.js background.js clip-graphics-ui.js keyboard-shortcuts-v065.js editor.js image-editor-core-v0611.js image-layers-v0612.js image-type-effects-v0613.js capture-output-v0614.js capture-result-v0614.js selection-v0614.js image-vector-v0615.js pen-input-v0616.js shortcut-core-v0617.js studio-shortcuts-v0617.js studio-menus-v0617.js keyboard-shortcuts-v065.js clip-timeline-ui.js clip-workspace-ui.js; do
            node --check "$src"
          done
      - name: Produce full extension and strict in-place overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package-extension.py --out dist --version v0.6.17-shortcuts-alpha.1
          python3 tools/build-v0617-overlay.py --out dist
          unzip -t dist/MangoShot-v0.6.17-shortcuts-alpha.1-Extension.zip
          unzip -t dist/MangoShot-v0.6.17-shortcut-menus-overlay-from-v0.6.16.zip
          (cd dist && sha256sum MangoShot-*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: MangoShot-v0.6.17-Shortcuts-Menus
          path: |
            dist/MangoShot-v0.6.17-shortcuts-alpha.1-Extension.zip
            dist/MangoShot-v0.6.17-shortcut-menus-overlay-from-v0.6.16.zip
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish versioned development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v0.6.17-shortcuts-alpha.1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag exists; will not overwrite versioned assets."
            exit 0
          fi
          gh release create "$tag" \
            dist/MangoShot-v0.6.17-shortcuts-alpha.1-Extension.zip \
            dist/MangoShot-v0.6.17-shortcut-menus-overlay-from-v0.6.16.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'MangoShot v0.6.17 — Keyboard Shortcuts & Menus Alpha 1' \
            --notes-file docs/V0.6.17-SHORTCUTS-MENUS.md \
            --prerelease --latest=false
