<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangoShot Recorder</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">🥭 MangoShot <span class="muted">/ Video recorder</span></div><small>SCREEN · AUDIO · LIVE INK</small></header><div class="options"><label><input type="checkbox" id="mic"> Microphone</label><label><input type="checkbox" id="audio" checked> Shared tab/system audio when available</label><label>Ink color <input type="color" id="color" value="#ffba08"></label><label>Stroke <input type="range" id="size" min="1" max="24" value="5"></label></div><div class="toolbar"><button id="start" class="primary">Start recording</button><button id="pause" disabled>Pause</button><button id="stop" disabled>Stop & export</button><button id="clear">Clear live ink</button><span class="status" id="status" role="status">Ready. Choose what to share when prompted.</span></div><main><div class="screen-wrap"><video id="preview" muted autoplay playsinline></video><canvas id="ink"></canvas></div><p class="hint" style="padding:0 22px">Choose a tab, window, or screen. Drawing in this preview is included in the recorded video. For live on-screen drawing outside this preview, a desktop companion is required.</p></main><script src="recorder.js"></script></body></html>
